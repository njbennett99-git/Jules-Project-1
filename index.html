<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Shooter</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #000;
    color: #fff;
    font-family: sans-serif;
    touch-action: none; /* Prevent default touch actions like scrolling */
  }
  canvas {
    display: block;
  }
  #fullscreenBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 10px 15px;
    background-color: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid white;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>
<button id="fullscreenBtn">Fullscreen</button>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log(`Error attempting to enable fullscreen: ${err.message}`);
      });
    }
  });

  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      fullscreenBtn.style.display = 'none';
    } else {
      fullscreenBtn.style.display = 'block';
    }
    resize();
  });
  const ctx = canvas.getContext('2d');

  let width, height;

  function resize() {
    width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    if (player) {
      const padding = height * 0.05;
      player.y = height - player.height / 2 - padding; // Keep fully visible at bottom
    }
  }

  window.addEventListener('resize', resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }

  let score = 0;
  let player = {
    x: 0,
    y: 0,
    width: 40,
    height: 40,
    speed: 8
  };

  resize(); // Initialize dimensions after player is defined
  player.x = width / 2;

  const assets = {
    ship: new Image(),
    enemy: new Image(),
    projectile: new Image()
  };

  function loadAssets(callback) {
    let loadedCount = 0;
    const totalAssets = Object.keys(assets).length;

    function onImageLoad() {
      loadedCount++;
      if (loadedCount === totalAssets) {
        callback();
      }
    }

    assets.ship.onload = onImageLoad;
    assets.enemy.onload = onImageLoad;
    assets.projectile.onload = onImageLoad;

    assets.ship.src = 'assets/playerShip1_blue.png';
    assets.enemy.src = 'assets/enemyBlack1.png';
    assets.projectile.src = 'assets/laserBlue01.png';
  }

  let projectiles = [];
  let enemies = [];

  let touchX = null;

  // Touch controls
  canvas.addEventListener('touchstart', (e) => {
    touchX = e.touches[0].clientX;
  });

  canvas.addEventListener('touchmove', (e) => {
    touchX = e.touches[0].clientX;
  });

  canvas.addEventListener('touchend', () => {
    touchX = null;
  });

  // Mouse controls for testing on desktop
  let isMouseDown = false;
  canvas.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    touchX = e.clientX;
  });

  canvas.addEventListener('mousemove', (e) => {
    if (isMouseDown) {
      touchX = e.clientX;
    }
  });

  canvas.addEventListener('mouseup', () => {
    isMouseDown = false;
    touchX = null;
  });

  canvas.addEventListener('mouseleave', () => {
    isMouseDown = false;
    touchX = null;
  });

  let lastTime = 0;
  let shootInterval;
  let spawnInterval;

  function update(deltaTime) {
    // Move player
    if (touchX !== null) {
      const dx = touchX - player.x;
      if (Math.abs(dx) > player.speed) {
        player.x += Math.sign(dx) * player.speed;
      } else {
        player.x = touchX;
      }
    }

    // Keep player on screen
    const padding = height * 0.05;
    if (player.x < player.width / 2) player.x = player.width / 2;
    if (player.x > width - player.width / 2) player.x = width - player.width / 2;
    if (player.y < player.height / 2) player.y = player.height / 2;
    if (player.y > height - player.height / 2 - padding) player.y = height - player.height / 2 - padding;

    // Move projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      let p = projectiles[i];
      p.y -= p.speed;
      if (p.y < -10) {
        projectiles.splice(i, 1);
      }
    }

    // Move enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      if (e.y > height + e.height) {
        enemies.splice(i, 1);
      }
    }

    // Collisions
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      let enemyDestroyed = false;
      for (let j = projectiles.length - 1; j >= 0; j--) {
        let p = projectiles[j];

        // Simple AABB vs circle collision logic
        let closestX = Math.max(e.x - e.width / 2, Math.min(p.x, e.x + e.width / 2));
        let closestY = Math.max(e.y - e.height / 2, Math.min(p.y, e.y + e.height / 2));

        let distanceX = p.x - closestX;
        let distanceY = p.y - closestY;

        let distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);
        if (distanceSquared < (p.radius * p.radius)) {
          // Hit
          enemies.splice(i, 1);
          projectiles.splice(j, 1);
          score += 10;
          enemyDestroyed = true;
          break; // Enemy destroyed, move to next enemy
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw player
    const shipWidth = player.width;
    const shipHeight = shipWidth * (assets.ship.height / assets.ship.width);
    ctx.drawImage(
      assets.ship,
      player.x - shipWidth / 2,
      player.y - shipHeight / 2,
      shipWidth,
      shipHeight
    );

    // Draw projectiles
    for (let p of projectiles) {
      const projHeight = p.radius * 4;
      const projWidth = projHeight * (assets.projectile.width / assets.projectile.height);
      ctx.drawImage(
        assets.projectile,
        p.x - projWidth / 2,
        p.y - projHeight / 2,
        projWidth,
        projHeight
      );
    }

    // Draw enemies
    for (let e of enemies) {
      const enemyWidth = e.width;
      const enemyHeight = enemyWidth * (assets.enemy.height / assets.enemy.width);
      ctx.drawImage(
        assets.enemy,
        e.x - enemyWidth / 2,
        e.y - enemyHeight / 2,
        enemyWidth,
        enemyHeight
      );
    }

    // Draw score
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 15, 35);
  }

  function loop(timestamp) {
    let deltaTime = timestamp - lastTime;
    lastTime = timestamp;

    update(deltaTime);
    draw();
    requestAnimationFrame(loop);
  }

  // Initialize game after assets are loaded
  loadAssets(() => {
    // Shooting
    shootInterval = setInterval(() => {
      projectiles.push({
        x: player.x,
        y: player.y - player.height / 2,
        radius: 5,
        speed: 7
      });
    }, 500);

    // Enemy spawning
    spawnInterval = setInterval(() => {
      const size = 30 + Math.random() * 20;
      enemies.push({
        x: Math.random() * (width - size) + size / 2,
        y: -size,
        width: size,
        height: size,
        speed: 2 + Math.random() * 3
      });
    }, 1000);

    requestAnimationFrame(loop);
  });
</script>
</body>
</html>
