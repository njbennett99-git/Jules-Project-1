<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Shooter</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #000;
    color: #fff;
    font-family: sans-serif;
    touch-action: none; /* Prevent default touch actions like scrolling */
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    if (player) {
      player.y = height - 50;
    }
  }

  window.addEventListener('resize', resize);

  let score = 0;
  let player = {
    x: 0,
    y: 0,
    width: 40,
    height: 40,
    speed: 8
  };

  resize(); // Initialize dimensions after player is defined
  player.x = width / 2;

  const assets = {
    ship: new Image(),
    enemy: new Image(),
    projectile: new Image()
  };

  function loadAssets(callback) {
    let loadedCount = 0;
    const totalAssets = Object.keys(assets).length;

    function onImageLoad() {
      loadedCount++;
      if (loadedCount === totalAssets) {
        callback();
      }
    }

    assets.ship.onload = onImageLoad;
    assets.enemy.onload = onImageLoad;
    assets.projectile.onload = onImageLoad;

    assets.ship.src = 'https://img.icons8.com/color/96/rocket.png';
    assets.enemy.src = 'https://img.icons8.com/color/96/alien.png';
    assets.projectile.src = 'https://img.icons8.com/color/48/laser-beam.png';
  }

  let projectiles = [];
  let enemies = [];

  let touchX = null;

  // Touch controls
  canvas.addEventListener('touchstart', (e) => {
    touchX = e.touches[0].clientX;
  });

  canvas.addEventListener('touchmove', (e) => {
    touchX = e.touches[0].clientX;
  });

  canvas.addEventListener('touchend', () => {
    touchX = null;
  });

  // Mouse controls for testing on desktop
  let isMouseDown = false;
  canvas.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    touchX = e.clientX;
  });

  canvas.addEventListener('mousemove', (e) => {
    if (isMouseDown) {
      touchX = e.clientX;
    }
  });

  canvas.addEventListener('mouseup', () => {
    isMouseDown = false;
    touchX = null;
  });

  canvas.addEventListener('mouseleave', () => {
    isMouseDown = false;
    touchX = null;
  });

  let lastTime = 0;
  let shootInterval;
  let spawnInterval;

  function update(deltaTime) {
    // Move player
    if (touchX !== null) {
      const dx = touchX - player.x;
      if (Math.abs(dx) > player.speed) {
        player.x += Math.sign(dx) * player.speed;
      } else {
        player.x = touchX;
      }
    }

    // Keep player on screen
    if (player.x < player.width / 2) player.x = player.width / 2;
    if (player.x > width - player.width / 2) player.x = width - player.width / 2;

    // Move projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      let p = projectiles[i];
      p.y -= p.speed;
      if (p.y < -10) {
        projectiles.splice(i, 1);
      }
    }

    // Move enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      if (e.y > height + e.height) {
        enemies.splice(i, 1);
      }
    }

    // Collisions
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      let enemyDestroyed = false;
      for (let j = projectiles.length - 1; j >= 0; j--) {
        let p = projectiles[j];

        // Simple AABB vs circle collision logic
        let closestX = Math.max(e.x - e.width / 2, Math.min(p.x, e.x + e.width / 2));
        let closestY = Math.max(e.y - e.height / 2, Math.min(p.y, e.y + e.height / 2));

        let distanceX = p.x - closestX;
        let distanceY = p.y - closestY;

        let distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);
        if (distanceSquared < (p.radius * p.radius)) {
          // Hit
          enemies.splice(i, 1);
          projectiles.splice(j, 1);
          score += 10;
          enemyDestroyed = true;
          break; // Enemy destroyed, move to next enemy
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw player
    ctx.drawImage(
      assets.ship,
      player.x - player.width / 2,
      player.y - player.height / 2,
      player.width,
      player.height
    );

    // Draw projectiles
    for (let p of projectiles) {
      const projSize = p.radius * 4;
      ctx.drawImage(
        assets.projectile,
        p.x - projSize / 2,
        p.y - projSize / 2,
        projSize,
        projSize
      );
    }

    // Draw enemies
    for (let e of enemies) {
      ctx.drawImage(
        assets.enemy,
        e.x - e.width / 2,
        e.y - e.height / 2,
        e.width,
        e.height
      );
    }

    // Draw score
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 15, 35);
  }

  function loop(timestamp) {
    let deltaTime = timestamp - lastTime;
    lastTime = timestamp;

    update(deltaTime);
    draw();
    requestAnimationFrame(loop);
  }

  // Initialize game after assets are loaded
  loadAssets(() => {
    // Shooting
    shootInterval = setInterval(() => {
      projectiles.push({
        x: player.x,
        y: player.y - player.height / 2,
        radius: 5,
        speed: 7
      });
    }, 300);

    // Enemy spawning
    spawnInterval = setInterval(() => {
      const size = 30 + Math.random() * 20;
      enemies.push({
        x: Math.random() * (width - size) + size / 2,
        y: -size,
        width: size,
        height: size,
        speed: 2 + Math.random() * 3
      });
    }, 1000);

    requestAnimationFrame(loop);
  });
</script>
</body>
</html>
