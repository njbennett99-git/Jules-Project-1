<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Shooter</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #000;
    color: #fff;
    font-family: sans-serif;
    touch-action: none; /* Prevent default touch actions like scrolling */
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    if (player) {
      player.y = height - 50;
    }
  }

  window.addEventListener('resize', resize);

  let score = 0;
  let player = {
    x: 0,
    y: 0,
    width: 40,
    height: 40,
    speed: 8
  };

  resize(); // Initialize dimensions after player is defined
  player.x = width / 2;

  let projectiles = [];
  let enemies = [];

  let touchX = null;

  // Touch controls
  canvas.addEventListener('touchstart', (e) => {
    touchX = e.touches[0].clientX;
  });

  canvas.addEventListener('touchmove', (e) => {
    touchX = e.touches[0].clientX;
  });

  canvas.addEventListener('touchend', () => {
    touchX = null;
  });

  // Mouse controls for testing on desktop
  let isMouseDown = false;
  canvas.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    touchX = e.clientX;
  });

  canvas.addEventListener('mousemove', (e) => {
    if (isMouseDown) {
      touchX = e.clientX;
    }
  });

  canvas.addEventListener('mouseup', () => {
    isMouseDown = false;
    touchX = null;
  });

  canvas.addEventListener('mouseleave', () => {
    isMouseDown = false;
    touchX = null;
  });

  // Shooting
  setInterval(() => {
    projectiles.push({
      x: player.x,
      y: player.y - player.height / 2,
      radius: 5,
      speed: 7
    });
  }, 300);

  // Enemy spawning
  setInterval(() => {
    const size = 30 + Math.random() * 20;
    enemies.push({
      x: Math.random() * (width - size) + size / 2,
      y: -size,
      width: size,
      height: size,
      speed: 2 + Math.random() * 3
    });
  }, 1000);

  let lastTime = 0;

  function update(deltaTime) {
    // Move player
    if (touchX !== null) {
      const dx = touchX - player.x;
      if (Math.abs(dx) > player.speed) {
        player.x += Math.sign(dx) * player.speed;
      } else {
        player.x = touchX;
      }
    }

    // Keep player on screen
    if (player.x < player.width / 2) player.x = player.width / 2;
    if (player.x > width - player.width / 2) player.x = width - player.width / 2;

    // Move projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      let p = projectiles[i];
      p.y -= p.speed;
      if (p.y < -10) {
        projectiles.splice(i, 1);
      }
    }

    // Move enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      if (e.y > height + e.height) {
        enemies.splice(i, 1);
      }
    }

    // Collisions
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      let enemyDestroyed = false;
      for (let j = projectiles.length - 1; j >= 0; j--) {
        let p = projectiles[j];

        // Simple AABB vs circle collision logic
        let closestX = Math.max(e.x - e.width / 2, Math.min(p.x, e.x + e.width / 2));
        let closestY = Math.max(e.y - e.height / 2, Math.min(p.y, e.y + e.height / 2));

        let distanceX = p.x - closestX;
        let distanceY = p.y - closestY;

        let distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);
        if (distanceSquared < (p.radius * p.radius)) {
          // Hit
          enemies.splice(i, 1);
          projectiles.splice(j, 1);
          score += 10;
          enemyDestroyed = true;
          break; // Enemy destroyed, move to next enemy
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw player (a simple triangle ship)
    ctx.fillStyle = '#0f0';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.height / 2);
    ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
    ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
    ctx.closePath();
    ctx.fill();

    // Draw projectiles
    ctx.fillStyle = '#ff0';
    for (let p of projectiles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw enemies
    ctx.fillStyle = '#f00';
    for (let e of enemies) {
      ctx.fillRect(e.x - e.width / 2, e.y - e.height / 2, e.width, e.height);
    }

    // Draw score
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 15, 35);
  }

  function loop(timestamp) {
    let deltaTime = timestamp - lastTime;
    lastTime = timestamp;

    update(deltaTime);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
